substitutions:
  _REGION: europe-west1
  _IMAGE_NAME: monolith
  _K8S_NAMESPACE: default
  _CLUSTER: monolith
  _ZONE: europe-west1-c
  _ARTIFACTS_IMAGE: ""
  # Movie batch-only deployment
  _BQ_PROJECT: $PROJECT_ID
  _BQ_DATASET: movie
  _BQ_TABLE: training_examples
  _BQ_LOCATION: US
  _BQ_PARALLELISM: '4'
  # Confluent Kafka configuration (optional - leave empty to use demo dataset)
  _CONFLUENT_BOOTSTRAP_SERVERS: ""
  _CONFLUENT_API_KEY: ""
  _CONFLUENT_API_SECRET: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build image (requires _ARTIFACTS_IMAGE)
  - name: gcr.io/cloud-builders/docker
    id: Build image
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_ARTIFACTS_IMAGE}" ]; then echo "_ARTIFACTS_IMAGE must be set"; exit 1; fi
        docker build \
          --build-arg ARTIFACTS_IMAGE=${_ARTIFACTS_IMAGE} \
          -t gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA .

  # 2) Push image
  - name: gcr.io/cloud-builders/docker
    id: Push image
    args: ["push", "gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA"]

  # (combine step removed; base image already includes artifacts)

  # 3) Set kubectl context (regional/Autopilot cluster)
  - name: gcr.io/cloud-builders/gcloud
    id: Get GKE credentials
    args: ["container", "clusters", "get-credentials", "${_CLUSTER}", "--zone", "${_ZONE}", "--project", "$PROJECT_ID"]

  # 3a) Ensure checkpoint PVC exists
  - name: gcr.io/cloud-builders/kubectl
    id: Ensure checkpoint PVC
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args: ["apply", "-n", "$_K8S_NAMESPACE", "-f", "kubernetes/monolith/monolith-checkpoint-pvc.yaml"]

  # 4) Render TFJob manifest for movie batch training (BigQuery)
  - name: gcr.io/cloud-builders/kubectl
    id: Render TFJob manifest
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE_URI="gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA"
        sed \
          -e "s#__IMAGE__#$$IMAGE_URI#g" \
          -e "s#__BQ_PROJECT__#$_BQ_PROJECT#g" \
          -e "s#__BQ_DATASET__#$_BQ_DATASET#g" \
          -e "s#__BQ_TABLE__#$_BQ_TABLE#g" \
          -e "s#__BQ_LOCATION__#$_BQ_LOCATION#g" \
          -e "s#__BQ_PARALLELISM__#$_BQ_PARALLELISM#g" \
          kubernetes/monolith/movie-batch-tfjob.yaml > /workspace/movie-batch-tfjob.rendered.yaml

  # 5) Create/Update ConfigMap holding the rendered TFJob for the scheduler
  - name: gcr.io/cloud-builders/kubectl
    id: Create/Update TFJob ConfigMap
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    entrypoint: bash
    args:
      - -c
      - |
        kubectl -n $_K8S_NAMESPACE create configmap movie-tfjob-cm \
          --from-file=tfjob.yaml=/workspace/movie-batch-tfjob.rendered.yaml \
          --dry-run=client -o yaml | kubectl -n $_K8S_NAMESPACE apply -f -

  # 6) Deploy ZooKeeper for model registration
  - name: gcr.io/cloud-builders/kubectl
    id: Deploy ZooKeeper
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args: ["apply", "-n", "$_K8S_NAMESPACE", "-f", "kubernetes/monolith/zookeeper.yaml"]

  # 6a) Create Kafka secrets from substitution variables
  - name: gcr.io/cloud-builders/kubectl
    id: Create Kafka Secrets
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    entrypoint: bash
    args:
      - -c
      - |
        # Create Kubernetes secret from substitution variables (if provided)
        if [ -n "${_CONFLUENT_BOOTSTRAP_SERVERS}" ] && [ -n "${_CONFLUENT_API_KEY}" ]; then
          kubectl create secret generic confluent-kafka-config \
            --from-literal=bootstrap-servers="${_CONFLUENT_BOOTSTRAP_SERVERS}" \
            --from-literal=api-key="${_CONFLUENT_API_KEY}" \
            --from-literal=api-secret="${_CONFLUENT_API_SECRET}" \
            --namespace=$_K8S_NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Confluent Kafka secrets created from substitution variables"
        else
          echo "Confluent substitution variables not provided - Kafka will use demo dataset fallback"
        fi

  # 7) Apply the scheduler CronJob/RBAC to run nightly
  - name: gcr.io/cloud-builders/kubectl
    id: Apply TFJob CronJob
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args: ["apply", "-n", "$_K8S_NAMESPACE", "-f", "kubernetes/monolith/movie-batch-cronjob.yaml"]

  # 8) Render and deploy online training
  - name: gcr.io/cloud-builders/kubectl
    id: Render Online Training manifest
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE_URI="gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA"
        sed -e "s#__IMAGE__#$$IMAGE_URI#g" \
          kubernetes/monolith/online.yaml > /workspace/online.rendered.yaml

  # 9) Deploy online training
  - name: gcr.io/cloud-builders/kubectl
    id: Deploy Online Training
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args: ["apply", "-n", "$_K8S_NAMESPACE", "-f", "/workspace/online.rendered.yaml"]

  # 10) Render and deploy serving agents
  - name: gcr.io/cloud-builders/kubectl
    id: Render Serving manifest
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE_URI="gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA"
        sed -e "s#__IMAGE__#$$IMAGE_URI#g" \
          kubernetes/monolith/agent.yaml > /workspace/agent.rendered.yaml

  # 11) Deploy serving agents
  - name: gcr.io/cloud-builders/kubectl
    id: Deploy Serving Agents
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args: ["apply", "-n", "$_K8S_NAMESPACE", "-f", "/workspace/agent.rendered.yaml"]

images:
  - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA"

timeout: "1200s"

