apiVersion: kubeflow.org/v1
kind: TFJob
metadata:
  name: fashion-two-tower-csv-batch
  namespace: default
spec:
  runPolicy:
    cleanPodPolicy: None
    backoffLimit: 10
    ttlSecondsAfterFinished: 86400
  tfReplicaSpecs:
    PS:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: fashion-two-tower-csv
            role: ps
        spec:
          containers:
          - name: tensorflow
            image: gcr.io/looksyuk/monolith-fashion-two-tower:latest
            imagePullPolicy: IfNotPresent
            command: ["python"]
            args:
              - "/fashion_model_two_tower.py"
              - "--training_type=batch"
              - "--model_dir=/checkpoints/fashion_two_tower"
              - "--model_name=fashion_two_tower"
              - "--batch_size=128"
              # CSV training data from GCS
              - "--fashion_batch_csv=gs://looksy-monolith-data/training_data/synthetic_training_data.csv"
              # Training parameters
              - "--max_steps=50000"
              - "--save_checkpoints_steps=5000"
              - "--batch_epochs=3"
            env:
              - name: ZK_SERVERS
                value: "monolith-zookeeper-client.default.svc.cluster.local:2181"
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "1"
            resources:
              requests:
                cpu: "1"
                memory: "4Gi"
              limits:
                cpu: "2"
                memory: "8Gi"
            volumeMounts:
              - name: checkpoint-volume
                mountPath: /checkpoints
          volumes:
            - name: checkpoint-volume
              persistentVolumeClaim:
                claimName: monolith-checkpoint-pvc

    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: fashion-two-tower-csv
            role: worker
        spec:
          containers:
          - name: tensorflow
            image: gcr.io/looksyuk/monolith-fashion-two-tower:latest
            imagePullPolicy: IfNotPresent
            command: ["python"]
            args:
              - "/fashion_model_two_tower.py"
              - "--training_type=batch"
              - "--model_dir=/checkpoints/fashion_two_tower"
              - "--model_name=fashion_two_tower"
              - "--batch_size=128"
              # CSV training data from GCS
              - "--fashion_batch_csv=gs://looksy-monolith-data/training_data/synthetic_training_data.csv"
              # Training parameters
              - "--max_steps=50000"
              - "--save_checkpoints_steps=5000"
              - "--batch_epochs=3"
            env:
              - name: ZK_SERVERS
                value: "monolith-zookeeper-client.default.svc.cluster.local:2181"
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "1"
            resources:
              requests:
                cpu: "2"
                memory: "8Gi"
              limits:
                cpu: "4"
                memory: "16Gi"
            volumeMounts:
              - name: checkpoint-volume
                mountPath: /checkpoints
          volumes:
            - name: checkpoint-volume
              persistentVolumeClaim:
                claimName: monolith-checkpoint-pvc
