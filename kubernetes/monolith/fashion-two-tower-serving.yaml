---
# Service for Fashion Two-Tower Model Serving
apiVersion: v1
kind: Service
metadata:
  name: monolith-fashion-two-tower-serving
spec:
  type: NodePort
  selector:
    app: monolith-fashion-two-tower-serving
  ports:
    - name: grpc
      port: 2223
      targetPort: 2223
      nodePort: 30225
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30503

---
# StatefulSet for Fashion Two-Tower Model Serving
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monolith-fashion-two-tower-serving
spec:
  serviceName: monolith-fashion-two-tower-serving
  replicas: 2
  selector:
    matchLabels:
      app: monolith-fashion-two-tower-serving
  template:
    metadata:
      labels:
        app: monolith-fashion-two-tower-serving
    spec:
      serviceAccountName: default
      containers:
      - name: agent
        image: gcr.io/looksyuk/monolith-fashion-two-tower:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "agent.py"]
        args:
          - "--conf=./two_tower.conf"
          - "--model_name=fashion_two_tower"
          - "--bzid=monolith_serving_test"
        env:
          # In-cluster ZooKeeper configuration
          - name: ZK_SERVER
            value: monolith-zookeeper-client.default.svc.cluster.local:2181
          - name: ZK_USE_SSL
            value: "false"
          - name: ZK_SESSION_TIMEOUT_MS
            value: "60000"
          - name: ZK_CONNECTION_TIMEOUT_MS
            value: "30000"
          # Port configuration for the agent
          - name: PORT
            value: "9090"     # archon port
          - name: PORT2
            value: "8502"     # agent heartbeat port
          - name: PORT3
            value: "2223"     # gRPC port (main serving port)
          - name: PORT4
            value: "8501"     # HTTP REST API port
          # TensorFlow logging
          - name: TF_CPP_MIN_LOG_LEVEL
            value: "1"
          - name: MONOLITH_TFS_BINARY
            value: "/output/bin/tensorflow_model_server"
        ports:
          - containerPort: 2223
            name: grpc
          - containerPort: 8501
            name: http
          - containerPort: 9090
            name: archon
        livenessProbe:
          tcpSocket:
            port: 2223
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 2223
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: checkpoint-volume
            mountPath: /checkpoints
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "4Gi"
      volumes:
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: monolith-checkpoint-pvc
