---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: movie-tfjob-scheduler-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: movie-tfjob-scheduler-role
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["tfjobs"]
    verbs: ["create","get","list","watch","patch","update","delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: movie-tfjob-scheduler-binding
subjects:
  - kind: ServiceAccount
    name: movie-tfjob-scheduler-sa
roleRef:
  kind: Role
  name: movie-tfjob-scheduler-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: movie-tfjob-scheduler
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: movie-tfjob-scheduler-sa
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
              - sh
              - -c
              - |
                echo "Applying Movie TFJob manifest…"
                kubectl apply -f /manifests/tfjob.yaml
            volumeMounts:
              - name: tfjob-manifest
                mountPath: /manifests
          volumes:
            - name: tfjob-manifest
              configMap:
                name: movie-tfjob-cm
                items:
                  - key: tfjob.yaml
                    path: tfjob.yaml


