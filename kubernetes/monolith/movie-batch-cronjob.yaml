---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: movie-tfjob-scheduler-sa

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: movie-tfjob-scheduler
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: movie-tfjob-scheduler-sa
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
              - sh
              - -c
              - |
                echo "Applying Movie TFJob manifest…"
                kubectl apply -f /manifests/tfjob.yaml
            volumeMounts:
              - name: tfjob-manifest
                mountPath: /manifests
          volumes:
            - name: tfjob-manifest
              configMap:
                name: movie-tfjob-cm
                items:
                  - key: tfjob.yaml
                    path: tfjob.yaml


