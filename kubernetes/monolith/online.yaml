---
# Headless Service for Parameter Server
apiVersion: v1
kind: Service
metadata:
  name: monolith-movie-online-ps
spec:
  clusterIP: None
  selector:
    app: monolith-movie-online-ps
  ports:
    - name: ps
      port: 2223

---
# Headless Service for Worker
apiVersion: v1
kind: Service
metadata:
  name: monolith-movie-online-worker
spec:
  clusterIP: None
  selector:
    app: monolith-movie-online-worker
  ports:
    - name: worker
      port: 2222

---
# StatefulSet for Parameter Server (Movie Model Testing)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monolith-movie-online-ps
spec:
  serviceName: monolith-movie-online-ps
  replicas: 1
  selector:
    matchLabels:
      app: monolith-movie-online-ps
  template:
    metadata:
      labels:
        app: monolith-movie-online-ps
    spec:
      serviceAccountName: monolith-model-registry-sa
      containers:
      - name: ps
        image: __IMAGE__  # Will be replaced by Cloud Build
        imagePullPolicy: IfNotPresent
        command: ["python", "/movie_online_model.py"]
        args:
          - "--training_type=online"
          - "--model_dir=/checkpoints/movie_lens_tutorial"
          - "--model_name=movie_lens_tutorial"
          - "--stream_timeout_ms=86400000"
          - "--skip_empty_batches=false"
          # Minimal Kafka args (will be ignored without Kafka setup)
          - "--kafka_topics=movie-topic"
          - "--kafka_group_id=movie-online-group"
          - "--kafka_servers=localhost:9092"
        env:
          # TF_CONFIG for distributed training
          - name: TF_CONFIG
            value: '{"cluster": {"ps": ["monolith-movie-online-ps-0.monolith-movie-online-ps.default.svc.cluster.local:2223"], "worker": ["monolith-movie-online-worker-0.monolith-movie-online-worker.default.svc.cluster.local:2222"]}, "task": {"type": "ps", "index": 0}}'
          # Pod name for index detection
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
          - containerPort: 2223
        volumeMounts:
          - name: checkpoint-volume
            mountPath: /checkpoints
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

      volumes:
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: monolith-checkpoint-pvc

---
# StatefulSet for Worker (Movie Model Testing)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monolith-movie-online-worker
spec:
  serviceName: monolith-movie-online-worker
  replicas: 1
  selector:
    matchLabels:
      app: monolith-movie-online-worker
  template:
    metadata:
      labels:
        app: monolith-movie-online-worker
    spec:
      serviceAccountName: monolith-model-registry-sa
      containers:
      - name: worker
        image: __IMAGE__  # Will be replaced by Cloud Build
        imagePullPolicy: IfNotPresent
        command: ["python", "/movie_online_model.py"]
        args:
          - "--training_type=online"
          - "--model_dir=/checkpoints/movie_lens_tutorial"
          - "--model_name=movie_lens_tutorial"
          - "--stream_timeout_ms=86400000"
          - "--skip_empty_batches=false"
          # Minimal Kafka args (will be ignored without Kafka setup)
          - "--kafka_topics=movie-topic"
          - "--kafka_group_id=movie-online-group"
          - "--kafka_servers=localhost:9092"
        env:
          # TF_CONFIG for distributed training
          - name: TF_CONFIG
            value: '{"cluster": {"ps": ["monolith-movie-online-ps-0.monolith-movie-online-ps.default.svc.cluster.local:2223"], "worker": ["monolith-movie-online-worker-0.monolith-movie-online-worker.default.svc.cluster.local:2222"]}, "task": {"type": "worker", "index": 0}}'
          # Pod name for index detection
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
          - containerPort: 2222
        volumeMounts:
          - name: checkpoint-volume
            mountPath: /checkpoints
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

      volumes:
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: monolith-checkpoint-pvc
