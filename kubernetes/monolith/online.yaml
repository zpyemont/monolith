---
# Headless Service for Parameter Server
apiVersion: v1
kind: Service
metadata:
  name: monolith-movie-online-ps
spec:
  clusterIP: None
  selector:
    app: monolith-movie-online-ps
  ports:
    - name: ps
      port: 2223

---
# Headless Service for Worker
apiVersion: v1
kind: Service
metadata:
  name: monolith-movie-online-worker
spec:
  clusterIP: None
  selector:
    app: monolith-movie-online-worker
  ports:
    - name: worker
      port: 2222

---
# StatefulSet for Parameter Server (Movie Model Testing)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monolith-movie-online-ps
spec:
  serviceName: monolith-movie-online-ps
  replicas: 1
  selector:
    matchLabels:
      app: monolith-movie-online-ps
  template:
    metadata:
      labels:
        app: monolith-movie-online-ps
    spec:
      serviceAccountName: monolith-model-registry-sa
      containers:
      - name: ps
        image: __IMAGE__  # Will be replaced by Cloud Build
        imagePullPolicy: IfNotPresent
        command: ["python", "/movie_online_model.py"]
        args:
          - "--training_type=online"
          - "--model_dir=/checkpoints/movie_lens_tutorial"
          - "--model_name=movie_lens_tutorial"
          - "--stream_timeout_ms=86400000"
          - "--skip_empty_batches=false"
          - "--kafka_servers=$(KAFKA_BOOTSTRAP_SERVERS)"
          - "--kafka_username=$(CONFLUENT_API_KEY)"
          - "--kafka_password=$(CONFLUENT_API_SECRET)"
          - "--kafka_topics=$(KAFKA_TOPIC)"
          - "--kafka_group_id=$(KAFKA_GROUP_ID)"
          - "--kafka_security_protocol=SASL_SSL"
        env:
          # TF_CONFIG for distributed training
          - name: TF_CONFIG
            value: '{"cluster": {"ps": ["monolith-movie-online-ps-0.monolith-movie-online-ps.default.svc.cluster.local:2223"], "worker": ["monolith-movie-online-worker-0.monolith-movie-online-worker.default.svc.cluster.local:2222"]}, "task": {"type": "ps", "index": 0}}'
          # Pod name for index detection
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          # ZooKeeper servers for model registration and realtime training
          - name: ZK_SERVERS
            value: "monolith-zookeeper-client.default.svc.cluster.local:2181"
          # Confluent Kafka on Google Cloud configuration (from Secret Manager)
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              secretKeyRef:
                name: confluent-kafka-config
                key: bootstrap-servers
                optional: true
          - name: CONFLUENT_API_KEY
            valueFrom:
              secretKeyRef:
                name: confluent-kafka-config
                key: api-key
                optional: true
          - name: CONFLUENT_API_SECRET
            valueFrom:
              secretKeyRef:
                name: confluent-kafka-config
                key: api-secret
                optional: true
          - name: KAFKA_TOPIC
            value: "training-sample-topic"
          - name: KAFKA_GROUP_ID
            value: "movie-training-group"
        ports:
          - containerPort: 2223
        volumeMounts:
          - name: checkpoint-volume
            mountPath: /checkpoints
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

      volumes:
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: monolith-checkpoint-pvc

